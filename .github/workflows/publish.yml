name: Publish to PyPI
# Uploads the files attached to a GitHub release, exactly as tested; nothing is rebuilt.
# Uses PyPI Trusted Publishing (OIDC), so no API token is stored anywhere.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose attached files to publish, for example v0.1.0
        required: true
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/workorder/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'workorder-*'
      - name: Refuse anything but the tested files
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # One case per released tag, added after its files are built and tested.
          # NotQuite 0.1.0 and 0.2.0 were published to the old PyPI project and never go to this one.
          case "$TAG" in
            *) echo "No tested checksums recorded for $TAG"; exit 1 ;;
          esac
          cd dist
          test "$(ls | wc -l)" = 2
          sha256sum -c ../expected.sha256
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
