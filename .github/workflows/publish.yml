name: Publish to PyPI
# Uploads the files attached to a GitHub release, exactly as tested; nothing is rebuilt.
# Uses PyPI Trusted Publishing (OIDC), so no API token is stored anywhere.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose attached files to publish, for example v0.1.0
        required: true
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/workorder/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'workorder-*'
      - name: Refuse anything but the tested files
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # One case per released tag, added after its files are built and tested.
          # NotQuite 0.1.0 and 0.2.0 were published to the old PyPI project and never go to this one.
          case "$TAG" in
            v0.5.0)
              printf '%s\n' \
                "b20a3f95785b007f290e05135c6a952006f3ea304c3f9da987807b1012434d71  workorder-0.5.0-py3-none-any.whl" \
                "d1d016133dab3d3e73c672b8f9dbe6dd7bf1c8357b49eebadcaeab8c0e0d942f  workorder-0.5.0.tar.gz" \
                > expected.sha256 ;;
            v0.12.0)
              printf '%s\n' \
                "b924215d54246357c3d481c16f0dcbe2aaf6f2214a65576b9faeda489a7d799a  workorder-0.12.0-py3-none-any.whl" \
                "787fdbd47f770bf1d813fa45f76888ce74ed0b679271a1c5b5e739d7bfeb0f25  workorder-0.12.0.tar.gz" \
                > expected.sha256 ;;
            v0.13.0)
              printf '%s\n' \
                "3db476ada3aee9c054d6a27ab6cb49abf196e8666f8c647dc7c00acbb9a73bf1  workorder-0.13.0-py3-none-any.whl" \
                "b5361556ae1d4ce84990525463b71bfcfdc53ad1781b8ff93e8b355928a48ff9  workorder-0.13.0.tar.gz" \
                > expected.sha256 ;;
            v0.14.0)
              printf '%s\n' \
                "c3db684bcaa5e3ea77598d6efc7ef3118185582a8f285a445a83245731557a5d  workorder-0.14.0-py3-none-any.whl" \
                "d02ca4328ccf1c652a54fd4e9f23c5209750f2088c5a761740e90ecb5f1a1eb8  workorder-0.14.0.tar.gz" \
                > expected.sha256 ;;
            v0.15.0)
              printf '%s\n' \
                "e828b7729aebd883a599671d8312429ab53ccce335f6bfa853cc503416b48bb0  workorder-0.15.0-py3-none-any.whl" \
                "77c482942ccb7ea4648528063b9141b47ee331e981f595221c4988f6fd249a02  workorder-0.15.0.tar.gz" \
                > expected.sha256 ;;
            v0.16.0)
              printf '%s\n' \
                "c68c0c7a75887df6b7479bf1afeab0b3ff141bb36139e5dd16012b0288fea427  workorder-0.16.0-py3-none-any.whl" \
                "431dea9908bb27a10fea11e2185b26a3855a2fe3bb84f68a5c4c787a080a3fa8  workorder-0.16.0.tar.gz" \
                > expected.sha256 ;;
            *) echo "No tested checksums recorded for $TAG"; exit 1 ;;
          esac
          cd dist
          test "$(ls | wc -l)" = 2
          sha256sum -c ../expected.sha256
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
