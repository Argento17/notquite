name: Checks
on: [push, pull_request]
permissions: {contents: read}
# A newer push to the same branch (or its pull request) replaces the older run.
concurrency:
  group: checks-${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
        shard: [1, 2, 3]
    steps:
      - {uses: actions/checkout@v4, with: {fetch-depth: 0}}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m pip install -e '.[test]'
      - name: Check the lowest supported pytest 8 release
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.10'
        run: python -m pip install pytest==8.3.3
      - name: Run one third of the test files
        shell: bash
        run: |
          files=$(python -c "import glob,sys; f=sorted(glob.glob('tests/test_*.py')); print(' '.join(x for i,x in enumerate(f) if i % 3 == ${{ matrix.shard }} - 1))")
          python -m pytest -n auto $files
      - run: workorder check
  real-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[test]'
      - run: sh examples/real-projects.sh python
