[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workorder"
version = "0.8.0"
description = "The task record for coding agents: every task recorded, a clear history, agents always go back to it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tom Bar-Haim"}]
keywords = ["tasks", "task-format", "coding-agents", "git", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pytest-xdist>=3"]

[project.urls]
Homepage = "https://github.com/Argento17/workorder"
Issues = "https://github.com/Argento17/workorder/issues"

[project.scripts]
workorder = "workorder.cli:main"

[tool.setuptools]
packages = ["workorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
