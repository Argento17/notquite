[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notquite"
version = "0.2.1"
description = "Checks whether DONE actually means done. Git, tests, merges, and deployment evidence."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tom Bar-Haim"}]
keywords = ["git", "tasks", "testing", "verification", "coding-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Argento17/notquite"
Issues = "https://github.com/Argento17/notquite/issues"

[project.scripts]
notquite = "notquite.cli:main"

[tool.setuptools]
packages = ["notquite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
